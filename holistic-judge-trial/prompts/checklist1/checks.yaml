# The itemised yes/no checklist. Every question is worded so that YES = the requirement is met and NO = it is not.
#   source: client = a direct breakdown of a phrase in the client's own rule text (nothing added);
#           fact   = a plain fact about the scene that tells the later steps which checks apply (not a quality check);
#           tagger = something the NGO's disapproval taggers marked often (11 of 198 tagged photos) that is not in the 16 rules;
#           team   = the team's own guidance (front angle, back-view exception), NOT in the client's document.
# The split of each rule into questions is OUR decomposition, not client wording: the NGO should review it.
# Rules R014-R016 are the SOP's "final QC" questions; they overlap with other rules and have no questions of their own
# (R014 -> R006; R015 -> R002, R003, R008; R016 -> R004, R007, R009, R010), as in the project's tagging sheet.
version: 1
covers:
  R014: [R006]
  R015: [R002, R003, R008]
  R016: [R004, R007, R009, R010]

checks:
  # ---- scene facts and non-photos -------------------------------------------------------------------------------
  - {id: F_PHOTO,         rule: FACT, source: tagger, q: "Is this a real photograph of an activity (not a bill, invoice, document, spreadsheet or screenshot)?", na: ""}
  - {id: F_SINGLE,        rule: FACT, source: tagger, q: "Is it a single photograph (not several photos combined into one collage)?", na: ""}
  - {id: F_VOLUNTEERS,    rule: FACT, source: fact,   q: "Is at least one volunteer visible?", na: ""}
  - {id: F_BENEFICIARIES, rule: FACT, source: fact,   q: "Is at least one beneficiary visible?", na: ""}
  - {id: F_BANNER,        rule: FACT, source: fact,   q: "Is a banner present in the photo?", na: ""}

  # ---- R001 banner ----------------------------------------------------------------------------------------------
  - {id: R001_VISIBLE,    rule: R001, source: client, q: "Is the banner clearly visible (fully in the frame, readable, not hidden behind people or objects)?", na: "no banner is present"}
  - {id: R001_POSITION,   rule: R001, source: client, q: "Is the banner properly positioned within the frame (not awkwardly placed or cut off by the frame edge)?", na: "no banner is present"}
  - {id: R001_STRAIGHT,   rule: R001, source: client, q: "Is the banner straight (not tilted or crooked)?", na: "no banner is present"}
  - {id: R001_FLAT,       rule: R001, source: client, q: "Is the banner free from folds, crumpling and creases?", na: "no banner is present"}

  # ---- R002 volunteer dress code --------------------------------------------------------------------------------
  - {id: R002_WHITE,      rule: R002, source: client, q: "Do all the visible volunteers wear white-on-white, or a white top with jeans?", na: "no volunteer is visible"}
  - {id: R002_NEAT,       rule: R002, source: client, q: "Is the volunteers' clothing neat, clean and presentable?", na: "no volunteer is visible"}

  # ---- R003 beneficiary visibility ------------------------------------------------------------------------------
  - {id: R003_FACE,       rule: R003, source: client, q: "Are the beneficiaries' faces and expressions clearly visible?", na: "no beneficiary is visible, or showing faces is not appropriate here"}
  - {id: R003_CLEAR,      rule: R003, source: client, q: "Are the beneficiaries' faces free from obstruction (not covered by objects, hands or other people)?", na: "no beneficiary is visible, or showing faces is not appropriate here"}
  - {id: R003_CROP,       rule: R003, source: client, q: "Are the beneficiaries free from awkward cropping (no face or body cut off by the frame edge)?", na: "no beneficiary is visible"}

  # ---- R004 natural expressions ---------------------------------------------------------------------------------
  - {id: R004_BEN_GAZE,   rule: R004, source: client, q: "Are the beneficiaries NOT looking straight into the camera?", na: "no beneficiary is visible"}
  - {id: R004_VOL_GAZE,   rule: R004, source: client, q: "Are the volunteers NOT looking straight into the camera?", na: "no volunteer is visible"}
  - {id: R004_GENUINE,    rule: R004, source: client, q: "Do the expressions and interactions look genuine?", na: "no people are visible"}

  # ---- R005 natural and candid ----------------------------------------------------------------------------------
  - {id: R005_CANDID,     rule: R005, source: client, q: "Is it a candid moment (not staged or overly posed)?", na: "no people are visible"}
  - {id: R005_INTERACT,   rule: R005, source: client, q: "Does it show genuine interaction between volunteers and beneficiaries?", na: "no people are visible"}

  # ---- R006 capture the actual seva -----------------------------------------------------------------------------
  - {id: R006_IDENTIFY,   rule: R006, source: client, q: "Can you tell which seva activity is being performed (for example food distribution, education support, healthcare assistance, animal care)?", na: ""}
  - {id: R006_ACTION,     rule: R006, source: client, q: "Is the activity actually being carried out in the photo (not just people standing, posing or waiting)?", na: ""}
  - {id: R006_VOLUNTEER_DOING, rule: R006, source: tagger, q: "Is at least one volunteer visibly carrying out the activity?", na: "the activity needs no volunteer in view (for example an animal-feeding scene)"}

  # ---- R007 camera angle ----------------------------------------------------------------------------------------
  - {id: R007_ANGLE,      rule: R007, source: client, q: "Does the camera angle capture the activity, the beneficiary and the volunteer interaction clearly?", na: ""}
  - {id: R007_LEVEL,      rule: R007, source: client, q: "Is the frame level (not tilted)?", na: ""}
  - {id: R007_PERSPECTIVE, rule: R007, source: client, q: "Is the perspective natural (no awkward very high, very low or distorted viewpoint)?", na: ""}
  - {id: R007_UNOBSTRUCTED, rule: R007, source: client, q: "Is the main subject free from obstruction by people or objects in front of it?", na: ""}

  # ---- R008 volunteer positioning -------------------------------------------------------------------------------
  - {id: R008_BACK,       rule: R008, source: client, q: "Is each volunteer shown from the front or side, with no volunteer's back prominently towards the camera?", na: "no volunteer is visible"}
  - {id: T_FRONT,         rule: R008, source: team,   q: "Are the main people in the frame seen from the front or side, rather than mainly from behind?", na: "no people are visible"}
  - {id: T_BACK_EXCEPTION, rule: R008, source: team,  q: "Where volunteers are seen from behind: are they wearing the dress code, is the NGO's logo and name visible on the back of their clothing, AND are the beneficiaries clearly visible?", na: "no volunteer is seen from behind"}

  # ---- R009 lighting --------------------------------------------------------------------------------------------
  - {id: R009_LIT,        rule: R009, source: client, q: "Are the subjects well-lit and clearly visible?", na: ""}
  - {id: R009_EXPOSURE,   rule: R009, source: client, q: "Is the photo free from being too dark or overexposed?", na: ""}
  - {id: R009_DIRECTION,  rule: R009, source: client, q: "Is the photo free from harsh backlighting and heavy shadows?", na: ""}

  # ---- R010 focus and clarity -----------------------------------------------------------------------------------
  - {id: R010_SHARP,      rule: R010, source: client, q: "Is the photograph sharp and in focus?", na: ""}
  - {id: R010_GRAIN,      rule: R010, source: client, q: "Is it free from visible grain or noise?", na: ""}
  - {id: R010_SHAKE,      rule: R010, source: client, q: "Is it free from camera shake and motion blur?", na: ""}

  # ---- R011 clean background ------------------------------------------------------------------------------------
  - {id: R011_BACKGROUND, rule: R011, source: client, q: "Is the background free from distractions that take attention away from the seva?", na: ""}
  - {id: R011_CLUTTER,    rule: R011, source: client, q: "Is the scene free from clutter and scattered materials?", na: ""}
  - {id: R011_UNRELATED,  rule: R011, source: client, q: "Is the frame free from unrelated objects that draw attention?", na: ""}

  # ---- R012 / R013 final QC (single questions) ------------------------------------------------------------------
  - {id: R012_DIGNITY,    rule: R012, source: client, q: "Does the photograph maintain the dignity of everyone involved?", na: ""}
  - {id: R013_HUMANITY,   rule: R013, source: client, q: "Does the photograph reflect the spirit of humanity and compassion?", na: ""}
