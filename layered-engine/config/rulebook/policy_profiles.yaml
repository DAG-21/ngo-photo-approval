      # ---- reworded rules, facts and gates (the owner's wording) ----
      R002_GIVER_WHITE:
        description_operational: "Is every person who is giving something to a beneficiary wearing a white top?"
        applicability: item_given
        na_condition_text: no item is being given to a beneficiary
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R003_FACE:
        description_operational: "Is some part of every person's face visible, even if turned partly away: not covered, hidden or in shadow, and, for the main people, not too small to read?"
        applicability: people_visible
        na_condition_text: no person is visible
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R003_FACE_SHARP:
        description_operational: "Is every person's face sharp and in focus (not blurred by motion or poor focus)?"
        applicability: people_visible
        na_condition_text: no person is visible
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R004_GENUINE:
        description_operational: "Do the expressions and interactions look natural, with nothing forced or uncomfortable? A posed photograph is fine, including a posed group photograph of volunteers, and answers YES."
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R006_ACTION:
        description_operational: "Is a seva activity actually taking place (for example giving food, teaching, treating, caring for an animal), not just people standing or waiting?"
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R007_ANGLE:
        description_operational: "Is the activity captured from roughly the same level as the people (a slightly higher or lower angle is fine, a very high or very low angle is not), with a level frame, so that the activity is clearly visible and not obstructed?"
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R007_CUTOFF:
        description_operational: "Is everything important fully inside the frame: no key person, hands or objects cut off at the edges or hidden by the camera angle?"
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R007_PLACEMENT:
        description_operational: "Is the main subject sensibly placed in the frame (not squeezed into a corner or edge) and free from obstruction by people or objects in front of it?"
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R008_BACK:
        description_operational: "Is every person seen from the front or the side, with some part of the face visible (nobody shown fully from behind)?"
        applicability: people_visible
        na_condition_text: no person is visible
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R011_BACKGROUND:
        description_operational: "Is the background free from clutter, scattered materials and unrelated objects that draw attention away from the seva?"
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R015_BEN_RECEIVING:
        description_operational: "If an item is being given, is at least one beneficiary receiving it (or already holding it)?"
        applicability: item_given
        na_condition_text: no item is being given
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      F_VOLUNTEERS:
        description_operational: "Is at least one volunteer visible in this photo? A volunteer is a person wearing a white top, or a person giving something to a beneficiary."
        policy_change: {change_id: F-03, kind: FACT_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      F_BENEFICIARIES:
        description_operational: "Is at least one beneficiary visible in this photo? A beneficiary is any person not wearing a white top, whether or not they are receiving anything (they may already have received something, be next in line, or just be standing there). A person receiving something from a volunteer is also a beneficiary. A person giving something to a beneficiary is a volunteer, whatever they wear. An animal can also be a beneficiary."
        policy_change: {change_id: F-03, kind: FACT_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      F_ITEM_GIVEN:
        description_operational: "Is an item being handed over in this photo? An item is any substance, such as food, a packet, a sack or similar packed goods, medicine or a book, that is being given by a person's hands and received by a beneficiary's hands, whatever the giver is wearing. Only a visible hand-to-hand handover counts: people who are only interacting, standing together or talking, paperwork, forms, pamphlets or brochures, registration or checking of documents, and things lying on a table are not an item being handed over."
        policy_change: {change_id: F-03, kind: FACT_REWORDED, affects_mandatory: false, status: TEAM_APPROVED, reason: "Owner 2026-11-05 (see working-notes/agreed_drafts.json)."}
      R006_SIZE:
        description_operational: "Are the main people and the seva activity clearly visible: large enough in the frame and not blocked from view?"
        decision_effect: SOFT_SCORE
        gate_id: G020
        policy_change: {change_id: F-02, kind: GATE_TO_SOFT, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-05: the size rule becomes a SOFT gate (it caps activity_communication once; a score of 0 means stop). It starts soft because the old zoomed-out gate fired on 4 of 11 approved photos."}
      R006_ITEM_SHARP:
        description_operational: "If an item is being handed over, is the item sharp and in focus and clear enough to recognise? A sack or similar packed goods count as items, and their contents need not be visible. Text, labels or print on the item (for example the words on newspapers) do not need to be readable: answer YES when you can tell what kind of item it is."
        policy_change: {change_id: F-04, kind: RULE_REWORDED, affects_mandatory: true, status: TEAM_APPROVED, reason: "Owner 2026-11-06: a sack or similar packed goods are items and need not show their contents; an item is something handed from a volunteer's hands to a beneficiary's hands."}
