provider: anthropic
# Claude Haiku 5.5 (model id from Anthropic's model list, 2026-11-05). Used instead of gemini_config.yaml when the demo is started with the haiku vision model
# (run_demo.ps1 -Vision haiku, or serve_fresh.py --vision haiku, or NGO_VISION=haiku). Nothing is sent anywhere until the owner has put ANTHROPIC_API_KEY and
# NGO_ALLOW_ANTHROPIC_INFERENCE=true in image-classifier/.env: the photographs then go to Anthropic as well as to Google, so the NGO's notice must cover it.
model_id: claude-haiku-5-5

generation:
  max_output_tokens: 8192          # the short answer is about 2,000 tokens; a longer answer than this is an error, never a guess
  thinking: disabled               # Haiku 5.5 thinks by default (adaptive) and thinking is billed as output; "disabled" is accepted at effort high or lower. Measure accuracy before turning it on.
  # effort: low                    # optional (low | medium | high): the default is medium. Not set: a lower effort may shorten the answer, which has not been measured.
  request_timeout_s: 180
  # No temperature or other sampling setting: Haiku 5.5 rejects them. Images are sent as the original bytes (a larger photograph is scaled down by Anthropic: at most about 1,568 px
  # on the long side unless the model gets the high-resolution tier, which Anthropic's documentation does not state for Haiku 5.5).

evaluation:
  profile: layered_final_v1
  unknown_is_fail: true
  human_review_enabled: true
  response_format: compact         # the short answer format (src/layered_engine/compact.py): about 2,000 output tokens instead of 5,500

cache:
  enabled: true                    # the rules and answer instructions (about 8,000 tokens) are identical for every photograph of a prompt version: cached reads cost a tenth of the input price
  ttl: 5m                          # 5m (cache write 1.25x the input price) or 1h (2x). The cache only helps while photographs keep arriving within the lifetime; a lone photograph pays the write.

processing:
  batch_enabled: true
  max_concurrent_requests: 5
  retry_attempts: 3
  initial_backoff_s: 2.0
  max_backoff_s: 30.0
  max_calls_default: 100           # hard stop per run unless --max-calls says otherwise

auth:
  # The key is read from ANTHROPIC_API_KEY and never logged. A Claude Pro subscription does NOT include API calls: the API is billed separately, from the Anthropic Console.
  api_key_env: ANTHROPIC_API_KEY
  # Its own switch (not NGO_ALLOW_CLOUD_INFERENCE, which covers Google): Anthropic is a different company.
  authorization_env: NGO_ALLOW_ANTHROPIC_INFERENCE

cost:
  # USD per million tokens, from Anthropic's pricing page (read 2026-11-05), prompts of up to 100,000 tokens (above that the prices are 0.50 / 2.50). Cache reads cost a tenth of the input
  # price; a 5-minute cache write costs 1.25 times the input price. Thinking, if switched on, is inside the output tokens. Batch processing (half price) is not used.
  per_model:
    claude-haiku-5-5: {input: 0.10, output: 0.50, cached_input: 0.01, cache_write_input: 0.125}
  # used only for a model missing from the table above
  input_per_million_usd: 0.10
  output_per_million_usd: 0.50
