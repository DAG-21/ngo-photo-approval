[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-photo-approval"
version = "0.1.0"
description = "NGO photo approval engine: rule evaluation + fine-tuned cloud VLM + calibrated probability"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "google-genai>=1.0",
    "google-cloud-storage>=2.16",
    "pillow-heif>=0.16",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# only for scripts/embedding_probe.py (local image-signal check); install torch from the CPU index
probe = ["torch", "transformers"]
# scripts/make_tagging_sheet.py (Excel sheet for human tagging)
tagging = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # long prose strings in reports/prompts are intentional

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
