# Machine-readable form of the client's rules document: rules/photo-approval-requirement-rules.txt
#
# THE TEXT DOCUMENT IS THE SINGLE SOURCE OF TRUTH. This file only adds structure to it.
#   * `original_text` is copied verbatim; `source_ref` ties each rule to its item in the document.
#   * A rule is `mandatory` ONLY if the document itself says so (marker words in configs/project.yaml).
#     The document currently says so for NO rule, so every rule is `scored`: each is evaluated against the
#     exact wording on every photo, but none rejects a photo on its own.
#   * If the document changes, the loader refuses to start until this file is re-synced:
#         python scripts/sync_rules.py            # report differences
#         python scripts/sync_rules.py --write    # apply them (new rules, changed wording, removed rules)
#   * descriptions / visual_evidence / applies_when are plain-language restatements of the wording, added for the
#     model; they must never add requirements the text does not contain.
rule_set_version: 1.2-sop
rule_set_confirmed: false
rules:
- rule_id: R001
  name: banner_visibility_presentation
  original_text: If a banner is present, ensure it is clearly visible, properly positioned, straight and free from folds, crumpling or creases.
  source_ref: Banner Visibility & Presentation
  description: If a banner is present, it is clearly visible, properly positioned, straight and free from folds, crumpling or creases.
  visual_evidence: Banner is clearly visible, properly positioned and straight, with no folds, crumpling or creases.
  applies_when: a banner is present in the photo
  requirement_type: scored
  mandatory_status_confirmed: true
  check_method: vlm
  enabled: true
  uncertain_policy: score_only
  applies_to_programs: []
  confirmed: true
  needs_manual_annotation: true
  limitations: Conditional rule - a photo without a banner is not applicable (PASS, N/A).
  notes: ''
- rule_id: R002
  name: volunteer_dress_code
  original_text: Volunteers should wear white-on-white or a white top with jeans. Ensure clothing is neat, clean and presentable.
  source_ref: Volunteer Dress Code
  description: Volunteers wear white-on-white or a white top with jeans, and their clothing is neat, clean and presentable.
  visual_evidence: Volunteers wear white-on-white or a white top with jeans; clothing looks neat, clean and presentable.
  applies_when: volunteers are visible in the photo
  requirement_type: scored
  mandatory_status_confirmed: true
  check_method: vlm
  enabled: true
  uncertain_policy: score_only
  applies_to_programs: []
  confirmed: true
  needs_manual_annotation: true
  limitations: The document does not define how to tell a volunteer from a beneficiary; use activity context only, never personal attributes.
  notes: ''
- rule_id: R003
  name: beneficiary_visibility
  original_text: Ensure the beneficiary’s face and expressions are clearly visible, wherever appropriate. Avoid obstructed faces and awkward cropping.
  source_ref: Beneficiary Visibility
  description: Wherever appropriate, the beneficiary's face and expressions are clearly visible, with no obstructed faces or awkward cropping.
  visual_evidence: The beneficiary's face and expression are clearly visible, not obstructed and not awkwardly cropped.
  additional_guidance: The photo must be taken from the front of the people, not from behind them. If the main people in the frame are seen mainly from behind (their backs towards the camera), this rule is not met (FAIL).
  applies_when: a beneficiary is visible and showing their face is appropriate
  requirement_type: scored
  mandatory_status_confirmed: true
  check_method: vlm
  enabled: true
  uncertain_policy: score_only
  applies_to_programs: []
  confirmed: true
  needs_manual_annotation: true
  limitations: 'Evaluates visibility only: no facial recognition, identification, or inference of beneficiary status. "Wherever appropriate" is not defined in the document.'
  notes: ''
- rule_id: R004
  name: natural_expressions
  original_text: Capture genuine expressions and interactions. Beneficiaries and volunteers should not look straight into the camera unless a specific photograph requires it.
  source_ref: Natural Expressions
  description: Expressions and interactions look genuine; beneficiaries and volunteers do not look straight into the camera unless a specific photograph requires it.
  visual_evidence: Genuine expressions and interactions; people are not looking straight into the camera (unless the photograph specifically requires it).
  applies_when: people are visible in the photo
  requirement_type: scored
  mandatory_status_confirmed: true
  check_method: vlm
  enabled: true
  uncertain_policy: score_only
  applies_to_programs: []
  confirmed: true
  needs_manual_annotation: true
  limitations: '"Unless a specific photograph requires it" is not defined in the document.'
  notes: ''
